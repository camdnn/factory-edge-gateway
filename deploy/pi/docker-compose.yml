# Runs on the Raspberry Pi. Tailscale runs on the host, not in a container.
#
#   PI_TAILNET_NAME=mypi.tailnet-name.ts.net PI_TAILSCALE_IP=$(tailscale ip -4) docker compose up -d
#
# With no variables set, Kafka is only reachable on localhost (handy for testing on a laptop).
x-logging: &logging
  # cap logs on the SD card: the edge agent logs about once a second
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    logging: *logging
    ports:
      # bind to the Tailscale interface only, so the home LAN can't reach the broker
      - "${PI_TAILSCALE_IP:-127.0.0.1}:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller # single-node KRaft, no ZooKeeper
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # EXTERNAL is what the laptop dials over Tailscale; INTERNAL is for the edge container.
      # Kafka hands clients the advertised address, so EXTERNAL must be the MagicDNS name.
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://${PI_TAILNET_NAME:-localhost}:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3 # the auto-created topic gets 3 partitions
      # keep the SD card alive: 24h or ~700 MiB per partition (~2 GiB total), whichever comes first.
      # small segments so size-based cleanup actually kicks in (the active segment is never deleted)
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 734003200
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      # sized for a 4 GB Pi 4; on a 2 GB Pi set KAFKA_HEAP_OPTS="-Xmx512m -Xms512m"
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx1g -Xms1g}
      # must be explicit: with env-var config the image leaves log.dirs unset and Kafka
      # writes to /tmp/kafka-logs inside the container, which is lost when it is recreated
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data

  edge:
    build:
      context: ../..
      dockerfile: deploy/pi/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on: [kafka]
    command:
      - -agent=${MTCONNECT_AGENT:-https://demo.mtconnect.org}
      - -brokers=kafka:19092
      - -state=/var/lib/edge/cursor.json
    volumes:
      - edge-state:/var/lib/edge

volumes:
  kafka-data:
  edge-state:
